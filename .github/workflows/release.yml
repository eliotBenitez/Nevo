name: Release

# Publishes signed installers and the updater manifest (latest.json) to a
# GitHub Release. Trigger by pushing a tag like `v0.1.2`, or run manually.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-24.04'
            # AppImage отключён: на свежем WebKitGTK он не запускается, поэтому
            # собираем только .deb/.rpm (AppImage добавляется в Release вручную).
            args: '--bundles deb,rpm'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libasound2-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-tools \
            gstreamer1.0-x \
            gstreamer1.0-gl

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish release
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS runners default Node to a ~2 GB heap, which `vite build` exceeds
          # while rendering chunks (OOM on the aarch64/x86_64 jobs).
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Nevo ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version. macOS: the app is ad-hoc signed (not notarized). After moving Nevo.app to /Applications, run "xattr -dr com.apple.quarantine /Applications/Nevo.app" once, or right-click the app and choose Open, to bypass Gatekeeper.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          retryAttempts: 2
          args: ${{ matrix.args }}

  # Builds a Flatpak bundle so Linux users get a fixed, recent WebKitGTK (from
  # the GNOME runtime) regardless of their distro. Runs after `release` so the
  # draft release already exists; it reuses the .deb that job published instead
  # of recompiling.
  flatpak:
    name: Flatpak (Linux)
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Download the .deb from the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --pattern '*_amd64.deb' \
            --dir . --clobber
          deb=$(ls *_amd64.deb | head -1)
          mv "$deb" flatpak-source.deb
          echo "Using $deb"

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo flatpak-build-dir com.eliotBenitezhvat.nevo.yml
          flatpak build-bundle flatpak-repo \
            "Nevo_${{ github.ref_name }}_amd64.flatpak" \
            com.eliotBenitezhvat.nevo \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Nevo_${{ github.ref_name }}_amd64.flatpak

  android:
    name: Android APK
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize Android project
        run: pnpm tauri android init --ci

      - name: Build APK
        run: pnpm tauri:android:build --apk --ci

      - name: Align and sign APK
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEY_BASE64:?Missing ANDROID_KEY_BASE64 secret}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD secret}"
          unsigned_apk=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name 'app-universal-release-unsigned.apk' -print -quit)
          test -n "$unsigned_apk"
          mkdir -p release
          aligned_apk="$RUNNER_TEMP/Nevo_${GITHUB_REF_NAME}_aligned.apk"
          signed_apk=release/Nevo_${GITHUB_REF_NAME}_android.apk
          key_file="$RUNNER_TEMP/android-release-key.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$key_file"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 "$unsigned_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$key_file" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEY_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" "$aligned_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$signed_apk"

      - name: Upload Android APK to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: release/Nevo_${{ github.ref_name }}_android.apk
