[package]
name = "nevo"
version = "0.2.0"
description = "Nevo editor"
authors = ["eliotBenitez"]
edition = "2021"
license = "AGPL-3.0-only"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nevo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-process = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "io-util"] }
futures-util = "0.3"
dashmap = "5"
fontdb = "0.23"
base64 = "0.22"
typst = "0.15.1"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-render = "0.15.1"
typst-as-lib = { version = "0.16.0", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }
zip = { version = "4", default-features = false, features = ["deflate", "aes-crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
percent-encoding = "2"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
keyring = { version = "4.1.6", features = ["apple-native-keyring-store"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
toml_edit = "0.25"
# In-house voice recording capture (commands::voice_recording): desktop-only,
# no third-party Tauri plugin. cpal owns the input stream, hound writes WAV.
cpal = "0.15"
hound = "3.5"

[target."cfg(target_os = \"linux\")".dependencies]
webkit2gtk = "2.0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

# `panic = "abort"` is intentionally NOT set here: Tauri command handlers and
# plugins rely on unwinding (e.g. catching panics at the IPC boundary so one
# bad command doesn't take down the whole webview process), and that is not a
# change to make without auditing every handler for unwind-safety.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# `tauri::generate_context!` brotli-compresses the whole frontend dist at
# quality 9 inside a proc macro, and build-time dependencies are compiled at
# opt-level 0 by default, so that step was needlessly slow on every release
# build after a frontend change. The encoder is only a build dependency.
[profile.release.package.brotli]
opt-level = 3

# Full debuginfo for ~800 third-party crates dominated `target/debug` size and
# link time. Keep it only for our own crate, which is what gets debugged.
[profile.dev.package."*"]
debug = false
